# Cloudflare Tunnel configuration for the SPSL landing page (template).
#
# Copy this file to the .cloudflared folder of your user profile, outside this
# project, for example:
#   C:\Users\<user>\.cloudflared\spsl-landing.yml
# Then replace the three placeholders. Do not put the real file, cert.pem or
# the <Tunnel-UUID>.json credentials file in this project or in git.

tunnel: <Tunnel-UUID>
credentials-file: C:\Users\<user>\.cloudflared\<Tunnel-UUID>.json

ingress:
  # The public hostname of the page, for example dev.example.com
  - hostname: <hostname>
    service: http://127.0.0.1:4321
  # Ingress rules must end with a rule that catches everything else.
  - service: http_status:404
